services:
  dolt:
    image: dolthub/dolt:latest
    working_dir: /var/lib/dolt/members
    command: ["sql-server", "--host", "0.0.0.0", "--port", "3306"]
    ports:
      - "3306:3306"
    volumes:
      - dolt-data:/var/lib/dolt
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    command: >
      bash -lc "pip install -r requirements.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: mysql+pymysql://root@dolt:3306/members
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      SECRET_KEY: change-me-in-production
      APP_ENV: development
      DEBUG: "true"
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      - dolt

volumes:
  dolt-data:
