{% extends "auth.html" %}
{% block title %}Join · Workers Club{% endblock %}
{% block auth %}
<h1>Request membership</h1>
<p class="muted">Create an account, verify the email code, then sign in. Nothing inside is public.</p>
{% include "partials/social_signin.html" %}
<form method="post" action="/register" class="stack">
    <label>
        Display name
        <input type="text" name="display_name" maxlength="120" required value="{{ display_name | default('') }}">
    </label>
    <label>
        Email
        <input type="email" name="email" autocomplete="email" required value="{{ email | default('') }}">
    </label>
    <label>
        Password
        <input type="password" name="password" autocomplete="new-password" required minlength="10">
        <span class="hint">At least 10 characters, with a letter and a number.</span>
    </label>
    <button type="submit" class="btn primary">Create membership</button>
</form>
<p class="links"><a href="/login">Already a member? Sign in</a></p>
{% endblock %}
